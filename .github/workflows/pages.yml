name: Publicar vista previa en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Preparar PHP y SQLite para la compilación
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-sqlite3
      - name: Probar la aplicación PHP
        run: python3 tests/integration.py
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Exportar páginas públicas
        run: python3 bin/build-pages.py --base-path /roboti
      - name: Validar exportación
        run: python3 tests/pages_export.py
      - name: Subir artefacto público
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
